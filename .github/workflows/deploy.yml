# Builds the site and publishes it to GitHub Pages on every push to master.
#
# One-time setup in your repo: Settings → Pages → Build and deployment →
# Source → "GitHub Actions". You do NOT need a gh-pages branch when using
# this workflow; it uploads the build directly.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Permissions the deploy step needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer run finish and cancel the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Reads the version from .ruby-version so it always matches local.
          ruby-version-file: ".ruby-version"
          # Caches installed gems between runs, so later builds are much faster.
          bundler-cache: true

      - name: Build the site
        run: bundle exec middleman build --verbose

      - name: Disable Jekyll processing
        # Without this, GitHub Pages ignores any file or folder starting with
        # an underscore. Harmless here, cheap insurance if you add one later.
        run: touch build/.nojekyll

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
