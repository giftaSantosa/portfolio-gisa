# 日本語版 — Japanese version of data/ui.yml.
# Currently a copy of the English text: translate the text in place.
# Keep the same keys and structure as the English file. Links, images,
# and other non-text fields must be kept in sync with it by hand.
#
# Interface text: section headings, button labels, and screen-reader labels —
# everything on the page that isn't your own content from the other data files.
# Accessed in templates as ui.<section>.<key>
#
# The Japanese version is data/ja/ui.yml. Keep the same keys in both files.
#
# %{title} and %{n} are placeholders, filled in with the project name and the
# screenshot number. Move them wherever the sentence needs them.

# The EN | JP switch in the nav.
lang_toggle:
  label: "Language"
  en: "EN"
  ja: "JP"

# Appended to links that open in a new tab, for screen readers.
opens_new_tab: "(opens in a new tab)"

skip_link: "Skip to main content"

nav:
  aria_label: "Main navigation"
  menu_toggle: "Toggle navigation menu"
  theme_toggle: "Switch between dark and light mode"
  theme_to_dark: "Switch to dark mode"
  theme_to_light: "Switch to light mode"

hero:
  # Typed out letter by letter as the main heading.
  greeting: "ようこそ！"
  view_projects: "View projects"
  portrait_alt: "Memoji of Gifta Santosa"

