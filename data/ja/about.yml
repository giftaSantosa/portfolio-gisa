# 日本語版 — Japanese version of data/about.yml.
# Currently a copy of the English text: translate the text in place.
# Keep the same keys and structure as the English file. Links, images,
# and other non-text fields must be kept in sync with it by hand.
#
# Personal details shown in the hero and about sections.
# Accessed in templates as data.about.<key>

# Your full name — rendered as the main <h1> of the page.
name: "Gifta Santosa"

# Your role or job title, shown directly under your name.
role: "ギフタのポートフォリオへ"

# One-sentence hook in the hero. Keep it short; it is set in large type.
tagline: >-
  元IT営業で、現在は東京にいるフルスタックエンジニア、ギフタです！

# Where you are based. Displayed as a small label in the hero.
location: "Tokyo, Japan"

# Set to false to hide the green "available for work" badge in the hero.
available_for_work: true

# Text of the availability badge (only shown when available_for_work is true).
availability_label: "Available for new projects"

# The About section body. Each list item becomes its own paragraph.
bio:
  - >-
    ウェブ開発の前は、約2.5年間、世界中の60人以上の開発者の採用に携わっていました。コーディングは、
    毎日の採用活動の中で生まれた好奇心から始まりました。自分が探している人材が作っているものを、
    自分でも実際に作れるのだろうか?と気になったのです😅
  - >-
    この好奇心がプログラミングへと変わり、2年間毎日仕事のあとに勉強を続け、高収入の仕事を辞めてITブートキャンプ
    に参加しました。そして今は、本番レベルで意義のあるプロダクトをもっと作っていく準備ができています!
  - >-
    約1.5年のプロジェクト・研修経験があり、バックエンド開発、特にRuby on Rails、Java、Pythonを専門としています。
    データベースはPostgreSQLとMySQLを使用し、Heroku Cloudへのデプロイ経験があります。
    AWS認定クラウドプラクティショナーを取得しました。
  - >-
    仕事以外では、ダンス、スノーボード、そしてキャニオニングやホワイトウォーターラフティングなどの
    エクストリームスポーツが大好きです！


# Short factual rows shown beside the bio. Add or remove freely.
facts:
  - label: "Experience"
    value: "プロジェクト・独学を通じてWebアプリケーションを構築してきた1.5年以上の経験"
  - label: "Focus"
    value: "バックエンド設計、API、データスクレイピング"
  - label: "Currently"
    value: "天気APIと連携するUmbrellaBotをAWSLambdaで開発中!"

# The technologies called out as pills in the About section.
highlights:
  - "Ruby on Rails"
  - "Java"
  - "Python"
  - "JavaScript"
  - "PostgreSQL"
  - "MySQL"
  - "Heroku"
  - "AWS"
