# Skills, grouped by category. Accessed in templates as data.skills.
#
# FIELD REFERENCE
# ---------------
# category (required) The group heading, e.g. "Languages".
# items    (required) List of skills in that group. Each has:
#            name  (required) The skill label shown on the pill.
#            level (optional) "core" or "working". Skills marked "core" are
#                             visually emphasised with the accent colour.
#                             Anything else renders as a plain pill.
#
# Add a whole new category by copying one of the blocks below.

- category: "Languages"
  items:
    - name: "Ruby"
      level: "core"
    - name: "Java"
      level: "core"
    - name: "Python"
      level: "core"
