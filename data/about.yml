# Personal details shown in the hero and about sections.
# Accessed in templates as data.about.<key>

# Your full name — rendered as the main <h1> of the page.
name: "Gifta Santosa"

# Your role or job title, shown directly under your name.
role: "Fullstack Developer"

# One-sentence hook in the hero. Keep it short; it is set in large type.
tagline: >-
  ex recruiter who is currently a fullstack software developer in Tokyo!

# Where you are based. Displayed as a small label in the hero.
location: "Tokyo, Japan"

# Set to false to hide the green "available for work" badge in the hero.
available_for_work: true

# Text of the availability badge (only shown when available_for_work is true).
availability_label: "Available for new projects"

# The About section body. Each list item becomes its own paragraph.
bio:
  - >-
    Before web development, I spent ~2.5 years recruiting for over 60+
    developers around the world! Coding actually started as a curiosity while
    I was recruiting every day. I was curious if I can actually build the things
    that I was sourcing for 😅
  - >-
    This curiosity turns to programming after work every day for 2 years, quit my high-paying job to join IT Bootcamp, and now I'm ready to
    build more production-level meaningful products!
  - >-
    With ~1.5 years of project & training experience, I specialize in backend development,
    in particular Ruby on Rails, Java, and Python. For databases, I've used PostgreSQL and MySQL,
    I've deployed on Heroku Cloud and on target to get AWS Cloud Practicioner Certification.
  - >-
    Outside of work, I love dancing, snowboarding, and extreme sports like canyoning or white water
    rafting! I build content from time to time on Linkedin and Instagram so let's connect!

# Short factual rows shown beside the bio. Add or remove freely.
facts:
  - label: "Experience"
    value: "1.5+ years of project & training to build web applications"
  - label: "Focus"
    value: "Backend architecture, APIs, and data scraping"
  - label: "Currently"
    value: "Making UmbrellaBot to tell that connects with weather API!"

# The technologies called out as pills in the About section.
highlights:
  - "Ruby on Rails"
  - "Java"
  - "Python"
  - "JavaScript"
  - "PostgreSQL"
  - "MySQL"
  - "Heroku"
  - "AWS"
